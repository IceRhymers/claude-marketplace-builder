[project]
name = "slack-mcp-server"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.8",
    "databricks-sdk>=0.30.0",
    "starlette",
    "uvicorn",
    "pyyaml",
]

[project.scripts]
slack-mcp-server = "app.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""
