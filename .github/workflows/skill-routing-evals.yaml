name: Skill Routing Evals

on:
  pull_request:
    paths:
      - "plugins/**/SKILL.md"
      - "evals/**"
  workflow_dispatch:
    inputs:
      base_url:
        description: "Custom ANTHROPIC_BASE_URL (leave empty to use DATABRICKS_AI_GATEWAY_URL secret)"
        required: false
        type: string
      workers:
        description: "Parallel workers"
        required: false
        default: "8"
        type: string
      timeout:
        description: "Per-test timeout in seconds"
        required: false
        default: "180"
        type: string

jobs:
  eval:
    runs-on: ubuntu-latest
    environment: cicd
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install eval dependencies
        working-directory: evals
        run: uv sync

      - name: Run skill routing evals
        working-directory: evals
        env:
          # --- Standard Anthropic (used when Databricks secrets are absent) ---
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

          # --- Databricks AI Gateway ---
          # Set these secrets to route evals through Databricks instead of
          # the standard Anthropic API.
          #
          # Required secrets:
          #   DATABRICKS_SP_TOKEN       — Service principal PAT / OBO token
          #   DATABRICKS_AI_GATEWAY_URL — e.g. https://WORKSPACE_ID.ai-gateway.cloud.databricks.com/anthropic
          #   DATABRICKS_AI_GATEWAY_MODEL — AI Gateway endpoint name (becomes ANTHROPIC_MODEL)
          #
          # The runner uses ANTHROPIC_AUTH_TOKEN as the primary credential, so
          # DATABRICKS_SP_TOKEN maps to both AUTH_TOKEN and API_KEY.
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.DATABRICKS_SP_TOKEN }}
          ANTHROPIC_BASE_URL: ${{ inputs.base_url || secrets.DATABRICKS_AI_GATEWAY_URL }}
          ANTHROPIC_MODEL: ${{ secrets.DATABRICKS_AI_GATEWAY_MODEL }}
          # Required header for Databricks AI Gateway coding-agent mode
          ANTHROPIC_CUSTOM_HEADERS: "x-databricks-use-coding-agent-mode: true"
          # Disable experimental betas incompatible with AI Gateway
          CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS: "1"
          # Disable eager_input_streaming — causes 400s on AI Gateway tool calls
          CLAUDE_CODE_ENABLE_FINE_GRAINED_TOOL_STREAMING: ""
        run: |
          uv run skill-evals \
            -j ${{ inputs.workers || '8' }} \
            --timeout ${{ inputs.timeout || '180' }} \
            -v
