# Skill routing eval test cases
# Uses bare skill names — runner does suffix matching across org slug prefixes

tests:
  # --- databricks-lineage (2) ---
  - name: lineage-trace-upstream
    prompt: "Trace the upstream lineage for the table main.sales.orders in Databricks Unity Catalog"
    expected_skill: databricks-lineage

  - name: lineage-column-dependencies
    prompt: "What are the column-level dependencies for the revenue column in main.finance.quarterly_report?"
    expected_skill: databricks-lineage

  # --- databricks-workspace-files (2) ---
  - name: workspace-list-notebooks
    prompt: "List all notebooks in the /Repos/team/etl-pipeline directory in our Databricks workspace"
    expected_skill: databricks-workspace-files

  - name: workspace-pull-file
    prompt: "Pull the SQL file at /Workspace/Shared/analytics/daily_metrics.sql from Databricks so I can review it"
    expected_skill: databricks-workspace-files

  # --- lucid-diagram (2) ---
  - name: diagram-architecture
    prompt: "Create an lucid chart architecture diagram showing our data pipeline from Kafka through Databricks to a Snowflake data warehouse"
    expected_skill: lucid-diagram

  - name: diagram-data-flow
    prompt: "Generate a Graphviz DOT diagram of the data flow between our ingestion layer, bronze, silver, and gold tables"
    expected_skill: lucid-diagram

  # --- mcp-setup (2) ---
  - name: mcp-setup-auth-check
    prompt: "My MCP tools aren't showing up in Claude Code, can you help me verify my Databricks auth is configured correctly?"
    expected_skill: mcp-setup

  - name: mcp-setup-proxy-missing
    prompt: "MCP proxy isn't working when I try to use Slack tools"
    expected_skill: mcp-setup

  # --- budget-setup (2) ---
  - name: budget-setup-troubleshoot
    prompt: "The budget checker hook isn't blocking me when I'm over budget, how do I troubleshoot it?"
    expected_skill: budget-setup

  - name: budget-setup-configure
    prompt: "How do I configure the BUDGET_API_URL for the AI Gateway budget enforcement plugin?"
    expected_skill: budget-setup
